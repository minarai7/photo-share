openapi: 3.0.3

info:
  title: Photo Share API
  version: 0.1.0
  description: Initial API contract for the Photo Share MVP.

servers:
  - url: https://localhost:8080
    description: Local backend server

tags:
  - name: auth
    description: Authentication endpoints
  - name: posts
    description: Post-related endpoints
  - name: ai
    description: Endpoints that use ai

paths:
  /auth/signup:
    post:
      tags:
        - auth
      summary: Create a new user account
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - auth
      summary: Log in an existing user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /users/{id}:
    get:
      tags:
        - auth
      summary: Get one user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: One user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts:
    get:
      tags:
        - posts
      summary: Get all posts
      operationId: listPosts
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

    post:
      tags:
        - posts
      summary: Create a new post
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /posts/{id}:
    get:
      tags:
        - posts
      summary: Get one post by ID
      operationId: getPostById
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: One post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - posts
      summary: Update a post
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: One post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - posts
      summary: Delete a post
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Post deleted successfully
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /uploads:
    post:
      tags:
        - posts
      summary: Upload a post image
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_path:
                    type: string
                    example: /uploads/posts/1714020000_abcd1234.jpg
        '400':
          description: Invalid file
        '401':
          description: Unauthorized
        '500':
          description: Upload failed

  /ai/gear-link:
    post:
      tags:
        - ai
      summary: Find AI-suggested product links for camera or lens gear
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GearLinkRequest'
            examples:
              camera:
                summary: Camera body search
                value:
                  kind: camera
                  name: Sony A7 III
              lens:
                summary: Lens search
                value:
                  kind: lens
                  name: Tamron 28-75mm f/2.8
      responses:
        '200':
          description: Gear link suggestions found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GearLinkResponse'
        '400':
          description: Invalid request body
        '401':
          description: Authentication required
        '500':
          description: Internal server error



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    SignupRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: yamato
        email:
          type: string
          format: email
          example: yamato@example.com
        password:
          type: string
          format: password
          example: secret123
    
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: yamato@example.com
        password:
          type: string
          format: password
          example: secret123
    
    User:
      type: object
      required:
        - id
        - username
        - email
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: yamato
        email:
          type: string
          format: email
          example: yamato@example.com
        created_at:
          type: string
          format: date-time
          example: 2026-04-14T12:00:00Z
      
    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: your-jwt-token-here
        user:
          $ref: '#/components/schemas/User'
    
    CreatePostRequest:
      type: object
      required:
        - image_path
        - caption
      properties:
        image_path:
          type: string
          example: /demo/test.jpg
        caption:
          type: string
          example: Sunset at the beach
        location:
          type: string
          nullable: true
          example: Kamakura
        camera_body:
          type: string
          nullable: true
          example: Sony A7 IV
        lens:
          type: string
          nullable: true
          example: FE 24-70mm F2.8 GM
    
    UpdatePostRequest:
      type: object
      required:
        - caption
      properties:
        caption:
          type: string
          example: Sunset at the beach
        location:
          type: string
          nullable: true
          example: Kamakura
        camera_body:
          type: string
          nullable: true
          example: Sony A7 IV
        lens:
          type: string
          nullable: true
          example: FE 24-70mm F2.8 GM

    Post:
      type: object
      required:
        - id
        - user_id
        - username
        - image_path
        - caption
        - created_at
        - updated_at
        - author
      properties:
        id:
          type: integer
          format: int64
          example: 100
        user_id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: yamato
        image_path:
          type: string
          example: /demo/test.jpg
        caption:
          type: string
          example: Sunset at the beach
        location:
          type: string
          nullable: true
          example: Kamakura
        camera_body:
          type: string
          nullable: true
          example: Sony A7 IV
        lens:
          type: string
          nullable: true
          example: FE 24-70mm F2.8 GM
        created_at:
          type: string
          format: date-time
          example: 2026-04-14T12:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-04-14T12:00:00Z
    
    GearKind:
      type: string
      enum:
        - camera
        - lens
      example: camera
    
    GearLinkConfidence:
      type: string
      enum:
        - high
        - medium
        - low
      example: high
    
    GearLinkRequest:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          $ref: '#/components/schemas/GearKind'
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Sony A7 III
    
    GearLinkSuggestion:
      type: object
      required:
        - title
        - url
        - reason
        - confidence
      properties:
        title:
          type: string
          example: Sony α7 III official product page
        url:
          type: string
          format: uri
          example: https://example.com
        reason:
          type: string
          example: Likely official product page for this camera body.
        confidence:
          $ref: '#/components/schemas/GearLinkConfidence'
    
    GearLinkResponse:
      type: object
      required:
        - kind
        - name
        - summary
        - suggestions
      properties:
        kind:
          $ref: '#/components/schemas/GearKind'
        name:
          type: string
          example: Sony A7 III
        summary:
          type: string
          example: Likely a Sony Alpha full-frame mirrorless camera body.
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/GearLinkSuggestion'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_input
        message:
          type: string
          example: Caption is required

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
          