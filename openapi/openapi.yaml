openapi: 3.0.3

info:
  title: Photo Share API
  version: 0.1.0
  description: Initial API contract for the Photo Share MVP.

servers:
  - url: https://localhost:8080
    description: Local backend server

tags:
  - name: auth
    description: Authentication endpoints
  - name: users
    description: User profile and user settings endpoints
  - name: posts
    description: Post-related endpoints
  - name: uploads
    description: Upload-related endpoints
  - name: ai
    description: Endpoints that use AI

paths:
  /auth/signup:
    post:
      tags:
        - auth
      summary: Create a new user account
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - auth
      summary: Log in an existing user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /users/{id}:
    get:
      tags:
        - auth
      summary: Get one user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: One user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /users/me/settings/language:
    put:
      tags:
        - users
      summary: Update current user's preferred language
      operationId: updatePreferredLanguage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferredLanguageRequest'
            example:
              preferred_language: ja
      responses:
        '204':
          description: Preferred language updated successfully
        '400':
          description: Invalid language value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /posts:
    get:
      tags:
        - posts
      summary: List posts, newest first
      description: >-
        Posts are ordered by created_at, then id, both descending. Each post
        has its cover (image_path / thumbnail_path) and image_count but no
        images array; GET /posts/{id} has the images. To page, pass limit and,
        for every page after the first, before_created_at + before_id of the
        last post received (send created_at back exactly as received). A page
        shorter than limit is the last one. Without limit, every post is
        returned (clients from before pagination).
      operationId: listPosts
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before_created_at
          in: query
          required: false
          description: created_at of the last post of the previous page (RFC 3339). Requires before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: id of the last post of the previous page. Requires before_created_at.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: user_id
          in: query
          required: false
          description: Only this user's posts.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: A page of posts (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          description: >-
            invalid_pagination (bad limit, or an incomplete or malformed
            cursor) or invalid_user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - posts
      summary: Create a new post
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /posts/{id}:
    get:
      tags:
        - posts
      summary: Get one post by ID
      operationId: getPostById
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: One post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - posts
      summary: Update a post
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: One post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - posts
      summary: Delete a post
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Post deleted successfully
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /uploads:
    post:
      tags:
        - uploads
      summary: Upload a post image
      description: >-
        Accepts JPEG, PNG or WebP (detected from the file content). The file may
        be at most `MAX_UPLOAD_BYTES` bytes (default 33554432 = 32 MiB);
        larger files are rejected with `400 file_too_large`.
        The camera and lens recorded in the photo's EXIF data (if any) are
        returned so clients can fill in post fields the user left blank.
        The stored (and publicly served) file has its metadata removed: EXIF
        including GPS, XMP, IPTC, comments and data after the image. The image
        data is not re-encoded; only the EXIF Orientation is kept. A file that
        has the right type but a broken structure is rejected with
        `400 invalid_image`.
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - image_path
                properties:
                  image_path:
                    type: string
                    example: /uploads/posts/1714020000_abcd1234.jpg
                  thumbnail_path:
                    type: string
                    description: >-
                      JPEG thumbnail for grids: at most 800 px wide (never
                      upscaled), height capped at 1600 px, orientation applied,
                      no metadata. Always the image name with "_w800.jpg" in
                      place of its extension. Omitted when none could be made
                      (e.g. animated or very large images); pass it on to
                      POST /posts.
                    example: /uploads/1714020000_abcd1234_w800.jpg
                  camera_body:
                    type: string
                    maxLength: 100
                    description: >-
                      Camera from EXIF Make + Model, e.g. "SONY ILCE-7C".
                      Omitted when the photo does not record it.
                    example: SONY ILCE-7C
                  lens:
                    type: string
                    maxLength: 100
                    description: >-
                      Lens from EXIF LensModel. Omitted when absent or a
                      placeholder such as "----" (manual lens).
                    example: FE 35mm F1.8
        '400':
          description: Invalid file
        '401':
          description: Unauthorized
        '500':
          description: Upload failed

  /ai/gear-link:
    post:
      tags:
        - ai
      summary: Find AI-suggested product links for camera or lens gear
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GearLinkRequest'
            examples:
              camera:
                summary: Camera body search
                value:
                  kind: camera
                  name: Sony A7 III
              lens:
                summary: Lens search
                value:
                  kind: lens
                  name: Tamron 28-75mm f/2.8
      responses:
        '200':
          description: Gear link suggestions found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GearLinkResponse'
        '400':
          description: Invalid request body
        '401':
          description: Authentication required
        '500':
          description: Internal server error



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    LanguageCode:
      type: string
      enum:
        - en
        - ja
      example: ja
    
    UpdatePreferredLanguageRequest:
      type: object
      required:
        - preferred_language
      properties:
        preferred_language:
          $ref: '#/components/schemas/LanguageCode'

    SignupRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: yamato
        email:
          type: string
          format: email
          example: yamato@example.com
        password:
          type: string
          format: password
          example: secret123
    
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: yamato@example.com
        password:
          type: string
          format: password
          example: secret123
    
    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - preferred_language
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: yamato
        email:
          type: string
          format: email
          example: yamato@example.com
        preferred_language:
          $ref: '#/components/schemas/LanguageCode'
        created_at:
          type: string
          format: date-time
          example: 2026-04-14T12:00:00Z
      
    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: your-jwt-token-here
        user:
          $ref: '#/components/schemas/UserResponse'
    
    CreatePostImage:
      type: object
      required:
        - image_path
      properties:
        image_path:
          type: string
          description: The image_path returned by POST /uploads.
          example: /demo/test.jpg
        thumbnail_path:
          type: string
          nullable: true
          description: >-
            The thumbnail_path returned by POST /uploads for this image_path.
            Anything else is rejected with 400 invalid_thumbnail_path.
          example: /demo/test_w800.jpg

    CreatePostRequest:
      type: object
      description: >-
        Send images (preferred). The single-image fields image_path and
        thumbnail_path are still accepted when images is absent or empty.
        Errors: 400 too_many_images (more than 10), duplicate_image (the same
        image_path twice), invalid_thumbnail_path, create_post_failed (no
        image or a blank image_path).
      required:
        - caption
      properties:
        images:
          type: array
          description: The post's images in display order; the first is the cover.
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CreatePostImage'
        image_path:
          type: string
          deprecated: true
          description: Single-image form; ignored when images is set.
          example: /demo/test.jpg
        thumbnail_path:
          type: string
          nullable: true
          deprecated: true
          description: Single-image form; ignored when images is set.
          example: /demo/test_w800.jpg
        caption:
          type: string
          example: Sunset at the beach
        location:
          type: string
          nullable: true
          example: Kamakura
        camera_body:
          type: string
          nullable: true
          example: Sony A7 IV
        lens:
          type: string
          nullable: true
          example: FE 24-70mm F2.8 GM

    PostImage:
      type: object
      required:
        - image_path
      properties:
        image_path:
          type: string
          example: /demo/test.jpg
        thumbnail_path:
          type: string
          nullable: true
          description: Small JPEG of this image; omitted when it has none.
          example: /demo/test_w800.jpg

    UpdatePostRequest:
      type: object
      required:
        - caption
      properties:
        caption:
          type: string
          example: Sunset at the beach
        location:
          type: string
          nullable: true
          example: Kamakura
        camera_body:
          type: string
          nullable: true
          example: Sony A7 IV
        lens:
          type: string
          nullable: true
          example: FE 24-70mm F2.8 GM

    Post:
      type: object
      required:
        - id
        - user_id
        - username
        - image_path
        - image_count
        - caption
        - created_at
        - updated_at
        - author
      properties:
        id:
          type: integer
          format: int64
          example: 100
        user_id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: yamato
        image_path:
          type: string
          description: The cover, i.e. images[0].image_path.
          example: /demo/test.jpg
        thumbnail_path:
          type: string
          nullable: true
          description: >-
            The cover's small JPEG for the feed and profile grids. Omitted
            when the cover has none; show image_path instead.
          example: /demo/test_w800.jpg
        image_count:
          type: integer
          minimum: 1
          maximum: 10
          description: How many images the post has.
          example: 3
        images:
          type: array
          description: >-
            All of the post's images in display order (1 to 10). Present on a
            single post (GET /posts/{id}, create, update); omitted from GET
            /posts, where image_count and the cover are enough for a card.
          minItems: 1
          items:
            $ref: '#/components/schemas/PostImage'
        caption:
          type: string
          example: Sunset at the beach
        location:
          type: string
          nullable: true
          example: Kamakura
        camera_body:
          type: string
          nullable: true
          example: Sony A7 IV
        lens:
          type: string
          nullable: true
          example: FE 24-70mm F2.8 GM
        created_at:
          type: string
          format: date-time
          example: 2026-04-14T12:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-04-14T12:00:00Z
    
    GearKind:
      type: string
      enum:
        - camera
        - lens
      example: camera
    
    GearLinkConfidence:
      type: string
      enum:
        - high
        - medium
        - low
      example: high
    
    GearLinkRequest:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          $ref: '#/components/schemas/GearKind'
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Sony A7 III
    
    GearLinkSuggestion:
      type: object
      required:
        - title
        - url
        - reason
        - confidence
      properties:
        title:
          type: string
          example: Sony α7 III official product page
        url:
          type: string
          format: uri
          example: https://example.com
        reason:
          type: string
          example: Likely official product page for this camera body.
        confidence:
          $ref: '#/components/schemas/GearLinkConfidence'
    
    GearLinkResponse:
      type: object
      required:
        - kind
        - name
        - summary
        - suggestions
      properties:
        kind:
          $ref: '#/components/schemas/GearKind'
        name:
          type: string
          example: Sony A7 III
        summary:
          type: string
          example: Likely a Sony Alpha full-frame mirrorless camera body.
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/GearLinkSuggestion'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_input
        message:
          type: string
          example: Caption is required

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
          